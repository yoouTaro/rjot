[package]
name = "rjot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
rjot-core = { path = "../core" }
# egui 0.34+ needs rustc 1.92+; 0.33 matches rgrip.
eframe = "0.33"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
rfd = "0.17"
rustybuzz = "0.20"
ab_glyph = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSSound", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSCell"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSGeometry", "NSObject", "NSError"] }
libc = "0.2"
raw-window-handle = "0.6"
